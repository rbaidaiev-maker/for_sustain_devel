<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>5. STEM 7 · Урок 5 · STEM для сталого розвитку: локальний вимір</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f2fb; --surface:#ffffff; --surface-2:#f7f6fc; --surface-3:#edeafc;
  --border:#e1ddf5; --ink:#1c1830; --ink-dim:#5c5578; --ink-faint:#948dae;
  --accent:#7c3aed; --accent-ink:#ffffff; --accent-soft:#efe8fd;
  --shadow:0 2px 10px rgba(40,20,90,.08); --shadow-lg:0 18px 44px rgba(40,20,90,.16);
  --s:#16a34a; --s-soft:#e6f7ec; --t:#2563eb; --t-soft:#e7effe;
  --e:#ca8a04; --e-soft:#fbf1dc; --m:#dc2626; --m-soft:#fbe6e5;
  --font-display:'Unbounded',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141126; --surface:#1c1832; --surface-2:#221d3c; --surface-3:#2b2549;
    --border:#352e57; --ink:#f1eefb; --ink-dim:#bcb4dc; --ink-faint:#847bab;
    --accent:#a78bfa; --accent-ink:#1c1832; --accent-soft:#312a54;
    --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.5);
    --s:#4ade80; --s-soft:#173726; --t:#60a5fa; --t-soft:#182c4c;
    --e:#facc15; --e-soft:#3a3011; --m:#f87171; --m-soft:#3d1c1e;
  }
}
:root[data-theme="dark"]{
  --bg:#141126; --surface:#1c1832; --surface-2:#221d3c; --surface-3:#2b2549;
  --border:#352e57; --ink:#f1eefb; --ink-dim:#bcb4dc; --ink-faint:#847bab;
  --accent:#a78bfa; --accent-ink:#1c1832; --accent-soft:#312a54;
  --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.5);
  --s:#4ade80; --s-soft:#173726; --t:#60a5fa; --t-soft:#182c4c;
  --e:#facc15; --e-soft:#3a3011; --m:#f87171; --m-soft:#3d1c1e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:40;}
.brandmark{font-family:var(--font-display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;display:flex;gap:1px;}
.brandmark span.S{color:var(--s);}.brandmark span.T{color:var(--t);}.brandmark span.E{color:var(--e);}.brandmark span.M{color:var(--m);}
.lesson-tag{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);border-left:1px solid var(--border);padding-left:12px;display:none;}
@media(min-width:640px){.lesson-tag{display:block;}}
.progress-wrap{flex:1;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--m));border-radius:4px;transition:width .4s ease;}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:.95rem;transition:background .15s, transform .15s;}
.icon-btn:hover{background:var(--surface-3);transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0);}

/* SLIDES */
.viewport{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease, transform .5s ease;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding:28px 20px 40px;}
.slide.active{opacity:1;pointer-events:auto;}
.slide-inner{max-width:1180px;width:100%;margin-left:auto;margin-right:auto;margin-top:auto;margin-bottom:auto;}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
h1.slide-title{font-family:var(--font-display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.5rem);line-height:1.15;margin:0 0 14px;}
h2.section-title{font-family:var(--font-display);font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);margin:0 0 12px;}
p.lead{font-size:1.05rem;color:var(--ink-dim);line-height:1.6;max-width:820px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;}
.badge.S{background:var(--s-soft);color:var(--s);}
.badge.T{background:var(--t-soft);color:var(--t);}
.badge.E{background:var(--e-soft);color:var(--e);}
.badge.M{background:var(--m-soft);color:var(--m);}
.badge.accent{background:var(--accent-soft);color:var(--accent);}

.online-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.88rem;color:var(--ink);}
.online-note i{color:var(--accent);margin-top:2px;}
.online-note b{font-family:var(--font-mono);text-transform:uppercase;font-size:.68rem;letter-spacing:.06em;display:block;margin-bottom:3px;color:var(--accent);}

button{font-family:var(--font-body);}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .15s;}
.btn:hover{background:var(--surface-3);transform:translateY(-1px);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.07);}
.btn.small{padding:6px 12px;font-size:.8rem;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn.ghost{background:transparent;}

textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--ink);
  padding:10px 12px;font-family:var(--font-body);font-size:.92rem;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
label.field-label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-dim);margin:0 0 6px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
.hint{font-size:.78rem;color:var(--ink-faint);margin-top:4px;font-style:italic;}
.shake{animation:shake .4s;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.field-error{border-color:var(--m) !important;}

/* BOTTOMBAR */
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;background:var(--surface);border-top:1px solid var(--border);flex:0 0 auto;z-index:40;}
.nav-btn{background:var(--accent);color:var(--accent-ink);border:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:transform .15s, filter .15s;}
.nav-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.slide-counter{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-dim);}
.kbd-hint{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);display:none;}
@media(min-width:760px){.kbd-hint{display:block;}}

/* MENU OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(10,6,30,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.overlay-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg);}
.overlay-panel h3{font-family:var(--font-display);margin:0 0 14px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.menu-item:hover{background:var(--surface-2);}
.menu-item .num{font-family:var(--font-mono);color:var(--ink-faint);width:22px;flex:0 0 auto;}
.menu-item.current{background:var(--accent-soft);color:var(--accent);font-weight:600;}

/* SDG chips */
.sdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;}
.sdg-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:.78rem;text-align:left;transition:all .15s;}
.sdg-chip:hover{border-color:var(--accent);}
.sdg-chip.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.sdg-num{font-family:var(--font-mono);font-weight:700;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.72rem;flex:0 0 auto;color:#fff;}

/* timer */
.timer-box{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px 16px;}
.timer-display{font-family:var(--font-mono);font-size:1.5rem;font-weight:600;min-width:70px;}
.timer-display.warn{color:var(--e);}
.timer-display.danger{color:var(--m);}

/* tech illustration cards */
.tech-illustration{width:100%;height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;}
.tech-illustration svg{max-height:100%;max-width:100%;}
.tech-illustration img{width:100%;height:100%;object-fit:cover;border-radius:12px;}

/* case tabs */
.case-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.case-tab{flex:1;min-width:160px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all .15s;}
.case-tab.active{background:var(--accent-soft);border-color:var(--accent);}
.case-tab .who{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.case-tab .cname{font-weight:700;font-size:.86rem;text-align:center;}
.case-tab .mini-svg{width:60px;height:44px;overflow:hidden;border-radius:8px;}
.case-tab .mini-svg img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.case-tab .doneflag{font-size:.7rem;color:var(--s);font-weight:700;}

/* tally */
.tally-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
.tally-count{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;min-width:36px;text-align:center;}
.circle-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.circle-btn:hover{background:var(--accent-soft);}

/* chalkboard */
.chalkboard{background:#1e3a2f;border:10px solid #6b4a2f;border-radius:10px;padding:24px;color:#eafff0;text-align:center;font-family:var(--font-mono);}
.chalk-num{font-size:clamp(2.2rem,7vw,4rem);font-weight:700;font-family:var(--font-display);}

.table-wrap{overflow-x:auto;}
table.roles-table{width:100%;border-collapse:collapse;font-size:.88rem;}
table.roles-table th,table.roles-table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);}
table.roles-table th{font-family:var(--font-mono);text-transform:uppercase;font-size:.7rem;color:var(--ink-faint);letter-spacing:.05em;}

.food-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.food-row input{flex:1;}

.pill-toggle{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.pill-toggle button{border:none;background:var(--surface-2);padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-dim);}
.pill-toggle button.active{background:var(--accent);color:var(--accent-ink);}

.summary-mini{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.summary-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:.82rem;}
.summary-row .mini-svg{width:32px;height:26px;flex:0 0 auto;overflow:hidden;border-radius:6px;}
.summary-row .mini-svg img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;transition:all .3s;z-index:300;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){.slide{padding:18px 12px 34px;}.card{padding:16px;}}
</style>
</head>

  example:{
    problem:'Брак води для поливу рослин у посушливих регіонах — звичайний полив розпилювачами втрачає багато води на випаровування, а рослинам не завжди дістається достатньо вологи.',
    s:'Рослини поглинають воду коренями з ґрунту; їхній ріст напряму залежить від сталого рівня вологи біля кореневої системи.',
    t:'Тонкі пластикові трубки з невеликими отворами-крапельницями, які подають воду точковими краплями безпосередньо до кожної рослини.',
    e:'Мережа труб під невисоким тиском, розкладена вздовж рядів рослин, з крапельницями на певній відстані одна від одної.',
    m:'Розрахунок тиску води в системі, витрати рідини на одну рослину та економії — до 30–50% води порівняно зі звичайним поливом.',
    sdg:[2,6],
    justification:'Рішення допомагає вирощувати врожай навіть при нестачі води (Ціль 2 — подолання голоду) і водночас економить чисту воду (Ціль 6 — чиста вода та санітарія).'
  },
  text:'Крапельне зрошення — це система тонких трубок з невеликими отворами (крапельницями), яка подає воду безпосередньо до кореня кожної рослини краплями, замість поливу всього поля водою з розпилювачів. Це дозволяє економити до 30–50% води порівняно зі звичайним поливом і використовується в посушливих регіонах світу, зокрема в сільському господарстві на Півдні України, в Ізраїлі та багатьох країнах Африки й Азії для вирощування врожаю там, де води обмаль. Система вимагає точних розрахунків тиску води, витрати рідини на рослину й розкладу поливу.',
  svg:`<svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="90" width="220" height="30" fill="var(--e-soft)"/><line x1="10" y1="40" x2="210" y2="40" stroke="var(--t)" stroke-width="5" stroke-linecap="round"/><g stroke="var(--t)" stroke-width="3"><line x1="30" y1="40" x2="30" y2="60"/><line x1="70" y1="40" x2="70" y2="60"/><line x1="110" y1="40" x2="110" y2="60"/><line x1="150" y1="40" x2="150" y2="60"/><line x1="190" y1="40" x2="190" y2="60"/></g><g fill="var(--t)"><circle cx="30" cy="64" r="3"/><circle cx="70" cy="64" r="3"/><circle cx="110" cy="64" r="3"/><circle cx="150" cy="64" r="3"/><circle cx="190" cy="64" r="3"/></g><g fill="var(--s)"><path d="M30 90 q-10 -22 0 -34 q10 12 0 34"/><path d="M70 90 q-10 -22 0 -34 q10 12 0 34"/><path d="M110 90 q-10 -22 0 -34 q10 12 0 34"/><path d="M150 90 q-10 -22 0 -34 q10 12 0 34"/><path d="M190 90 q-10 -22 0 -34 q10 12 0 34"/></g></svg>`},
 {id:'solar', title:'Портативні сонячні мікромережі', who:'За участі учня-волонтера', sdgHint:[7,11],
  text:'Портативна сонячна мікромережа — це набір сонячних панелей, акумуляторів і контролера, який встановлюють у селах чи районах, куди не проведено центральну електромережу. Одна така станція може забезпечити електрикою школу, медпункт або кілька десятків будинків. Такі рішення активно впроваджуються в сільських регіонах Африки, Індії, а також використовуються в Україні як резервне джерело живлення для лікарень і шкіл в умовах перебоїв з електропостачанням. Розрахунок такої системи вимагає точного визначення потрібної потужності, площі панелей та ємності акумуляторів.',
  svg:`<svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="30" width="70" height="42" rx="3" fill="var(--t-soft)" stroke="var(--t)" stroke-width="3"/><g stroke="var(--t)" stroke-width="1.5"><line x1="30" y1="44" x2="100" y2="44"/><line x1="30" y1="58" x2="100" y2="58"/><line x1="53" y1="30" x2="53" y2="72"/><line x1="76" y1="30" x2="76" y2="72"/></g><line x1="65" y1="72" x2="65" y2="90" stroke="var(--ink-faint)" stroke-width="3"/><rect x="120" y="55" width="46" height="30" rx="4" fill="var(--e-soft)" stroke="var(--e)" stroke-width="3"/><text x="143" y="75" font-size="14" text-anchor="middle" fill="var(--e)" font-family="monospace">⚡</text><line x1="100" y1="70" x2="120" y2="70" stroke="var(--e)" stroke-width="3"/><rect x="10" y="95" width="200" height="6" fill="var(--ink-faint)" opacity=".3"/></svg>`},

  text:'Керамічні фільтри для води — це прості й недорогі пристрої, які виготовляють із суміші глини та органічних матеріалів (наприклад, тирси або рисового лушпиння), обпалюють у печі, а потім вкривають тонким шаром срібла, що знищує бактерії. Вода, яка проходить крізь пори такого фільтра, стає значно чистішою й безпечнішою для пиття. Такі фільтри використовуються гуманітарними організаціями в багатьох країнах світу для забезпечення чистою водою громад, де немає централізованого водопостачання, і коштують значно дешевше за промислові системи очищення.',

/* ============ STORAGE HELPERS ============ */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(LP+key); return v===null? fallback : JSON.parse(v); }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(LP+key, JSON.stringify(val)); }catch(e){}
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function flashSaved(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.innerHTML = '<i class="fa-solid fa-check" style="color:var(--s);"></i> Збережено';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{
    if(document.getElementById('saveStatus')===el) el.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Зберігається автоматично';
  }, 1100);
}
function sdgColor(n){ const s = SDG.find(x=>x.n===n); return s? s.c : '#888'; }
function sdgTitle(n){ const s = SDG.find(x=>x.n===n); return s? s.t : ''; }
function caseVisual(c){ return c.photo ? `<img src="${c.photo}" alt="${c.title}" loading="lazy">` : c.svg; }

/* ============ SLIDE DEFINITIONS ============ */
const slides = [
  {id:'title', title:'Тема уроку', render: renderTitle},
  {id:'intro', title:'Актуалізація: що вимірюємо', render: renderIntro},
  {id:'measure', title:'Локальне вимірювання', render: renderMeasure},
  {id:'conclusion', title:'Міні-висновок: показник → ЦСР', render: renderConclusion},
  {id:'analyzer', title:'Аналіз STEM-рішень', render: renderAnalyzer},
  {id:'reflection', title:'Рефлексія', render: renderReflection}
];

let current = lsGet('currentSlide', 0);
if(typeof current !== 'number' || current<0 || current>=slides.length) current = 0;

const viewport = document.getElementById('viewport');

function buildSlides(){
  viewport.innerHTML = '';
  slides.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'slide';
    div.id = 'slide-'+s.id;
    div.dataset.index = i;
    viewport.appendChild(div);
  });
}
buildSlides();

function renderAllSlides(){
  slides.forEach((s)=>{
    const el = document.getElementById('slide-'+s.id);
    el.innerHTML = s.render();
  });
  attachAllHandlers();
}

function goTo(i){
  if(i<0) i=0; if(i>=slides.length) i=slides.length-1;
  current = i;
  lsSet('currentSlide', current);
  slides.forEach((s,idx)=>{
    document.getElementById('slide-'+s.id).classList.toggle('active', idx===current);
  });
  document.getElementById('curNum').textContent = current+1;
  document.getElementById('progressBar').style.width = (((current+1)/slides.length)*100)+'%';
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  refreshOnEnter(slides[current].id);
  buildMenu();
  window.scrollTo(0,0);
}

/* Some slides show data produced on other slides; since all slides are
   rendered once at load, re-render those specific slides on entry so
   they always reflect the latest saved state. */
function refreshOnEnter(slideId){
  if(slideId==='conclusion'){
    const el = document.getElementById('slide-conclusion');
    el.innerHTML = renderConclusion();
    attachConclusion();
  }
  if(slideId==='analyzer'){
    const el = document.getElementById('slide-analyzer');
    el.innerHTML = renderAnalyzer();
    attachAnalyzer();
  }
}

document.getElementById('totalNum').textContent = slides.length;
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));

document.addEventListener('keydown', (e)=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.key==='ArrowRight') goTo(current+1);
  else if(e.key==='ArrowLeft') goTo(current-1);
  else if(e.key==='Home') goTo(0);
  else if(e.key==='End') goTo(slides.length-1);
  else if(e.key==='Escape'){ closeMenu(); closeSdg(); }
});

/* ============ MENU OVERLAY ============ */
const menuOverlay = document.getElementById('menuOverlay');
function openMenu(){ menuOverlay.classList.add('open'); buildMenu(); }
function closeMenu(){ menuOverlay.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('closeMenuBtn').addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', (e)=>{ if(e.target===menuOverlay) closeMenu(); });
function buildMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = slides.map((s,i)=>`<div class="menu-item ${i===current?'current':''}" data-idx="${i}"><span class="num">${i+1}</span><span>${s.title}</span></div>`).join('');
  list.querySelectorAll('.menu-item').forEach(el=>{
    el.addEventListener('click', ()=>{ goTo(parseInt(el.dataset.idx)); closeMenu(); });
  });
}

function openSdg(){
  sdgOverlay.classList.add('open');
  document.getElementById('sdgFullList').innerHTML = SDG.map(s=>`

}

sdgOverlay.addEventListener('click', (e)=>{ if(e.target===sdgOverlay) closeSdg(); });

/* ============ THEME TOGGLE ============ */
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light') document.documentElement.setAttribute('data-theme','light');
  else if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}
let savedTheme = lsGet('theme', 'auto');
applyTheme(savedTheme);
themeBtn.addEventListener('click', ()=>{
  const order = ['auto','light','dark'];
  savedTheme = order[(order.indexOf(savedTheme)+1)%order.length];
  applyTheme(savedTheme);
  lsSet('theme', savedTheme);
  toast('Тема: ' + (savedTheme==='auto'?'системна':savedTheme==='light'?'світла':'темна'));
});

/* ============ TIMER FACTORY ============ */
function makeTimer(container, seconds, label){
  let remaining = seconds; let intervalId = null; let running=false;
  container.innerHTML = `
    <div class="timer-box">
      <i class="fa-regular fa-clock" style="color:var(--accent)"></i>
      <div><div class="timer-display" data-disp>${fmt(remaining)}</div><div style="font-size:.7rem;color:var(--ink-faint);font-family:var(--font-mono)">${label||''}</div></div>
      <button class="btn small" data-act="startpause" type="button">Старт</button>
      <button class="btn small ghost" data-act="reset" type="button">Скинути</button>
    </div>`;
  const disp = container.querySelector('[data-disp]');
  const spBtn = container.querySelector('[data-act="startpause"]');
  const rsBtn = container.querySelector('[data-act="reset"]');
  function fmt(s){ const m=Math.floor(s/60); const ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  function tick(){
    remaining--;
    disp.textContent = fmt(Math.max(remaining,0));
    disp.classList.toggle('warn', remaining<=60 && remaining>20);
    disp.classList.toggle('danger', remaining<=20);
    if(remaining<=0){ clearInterval(intervalId); running=false; spBtn.textContent='Старт'; toast('Час вийшов ⏰'); }
  }
  spBtn.addEventListener('click', ()=>{
    if(running){ clearInterval(intervalId); running=false; spBtn.textContent='Старт'; }
    else{ if(remaining<=0) remaining=seconds; intervalId=setInterval(tick,1000); running=true; spBtn.textContent='Пауза'; }
  });
  rsBtn.addEventListener('click', ()=>{
    clearInterval(intervalId); running=false; remaining=seconds; disp.textContent=fmt(remaining); disp.classList.remove('warn','danger'); spBtn.textContent='Старт';
  });
}

/* ============ FIELD VALIDATION ============ */
function requireField(el){
  if(!el.value || !el.value.trim()){
    el.classList.add('field-error','shake');
    setTimeout(()=>el.classList.remove('shake'), 400);
    return false;
  }
  el.classList.remove('field-error');
  return true;
}

function attachAllHandlers(){

/* ---- Measurement ---- */
function attachMeasure(){
  const classNInput = document.getElementById('classN');
  if(!classNInput) return;
  const v = LIGHT;
  function draw(){
    const tally = lsGet('measureTally', v.cats.map(()=>0));
    const rowsWrap = document.getElementById('tallyRows');
    rowsWrap.innerHTML = v.cats.map((c,i)=>`
      <div class="tally-row">
        <span style="font-size:.9rem;">${c}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="circle-btn" data-tdec="${i}" type="button">−</button>
          <span class="tally-count" data-tcount="${i}">${tally[i]}</span>
          <button class="circle-btn" data-tinc="${i}" type="button">+</button>
        </div>
      </div>`).join('');
    updateResult();
    rowsWrap.querySelectorAll('[data-tinc]').forEach(b=>b.addEventListener('click', ()=>{
      const i=parseInt(b.dataset.tinc); const t=lsGet('measureTally', v.cats.map(()=>0)); t[i]++; lsSet('measureTally',t);
      rowsWrap.querySelector(`[data-tcount="${i}"]`).textContent=t[i]; updateResult();
    }));
    rowsWrap.querySelectorAll('[data-tdec]').forEach(b=>b.addEventListener('click', ()=>{
      const i=parseInt(b.dataset.tdec); const t=lsGet('measureTally', v.cats.map(()=>0)); t[i]=Math.max(0,t[i]-1); lsSet('measureTally',t);
      rowsWrap.querySelector(`[data-tcount="${i}"]`).textContent=t[i]; updateResult();
    }));
  }
  function updateResult(){
    const N = parseInt(document.getElementById('classN').value)||0;
    const t = lsGet('measureTally', v.cats.map(()=>0));
    const sum = t.reduce((a,b)=>a+b,0);
    const sumCheck = document.getElementById('sumCheck');
    if(N>0){
      if(sum===N) sumCheck.innerHTML = `<span style="color:var(--s)"><i class="fa-solid fa-check"></i> Сума збігається: ${sum} з ${N}</span>`;
      else sumCheck.innerHTML = `<span style="color:var(--m)"><i class="fa-solid fa-triangle-exclamation"></i> Сума ${sum} ≠ ${N} — перевірте підрахунок</span>`;
    } else { sumCheck.innerHTML = ''; }
    const percent = N>0 ? Math.round((t[0]/N)*100) : null;
    document.getElementById('chalkPercent').textContent = percent!==null? percent+'%' : '—%';
    document.getElementById('chalkDetail').textContent = percent!==null? `${t[0]} з ${N} джерел — «${v.cats[0]}»` : 'заповніть дані вище';
    if(percent!==null){
      lsSet('measureResult', {percent, count:t[0], n:N});
    }
  }
  classNInput.addEventListener('input', ()=>{ lsSet('measureN', classNInput.value); updateResult(); });
  draw();
}

/* ---- Conclusion ---- */
function attachConclusion(){
  const grid = document.getElementById('conclusionSdgGrid');
  if(!grid) return;
  let selected = lsGet('conclusionSdg', []);
  grid.innerHTML = SDG.map(s=>`
    <button type="button" class="sdg-chip ${selected.includes(s.n)?'selected':''}" data-sdgpick="${s.n}">
      <span class="sdg-num" style="background:${s.c}">${s.n}</span><span>${s.t}</span>
    </button>`).join('');
  grid.querySelectorAll('[data-sdgpick]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const n = parseInt(chip.dataset.sdgpick);
      let sel = lsGet('conclusionSdg', []);
      if(sel.includes(n)) sel = sel.filter(x=>x!==n);
      else sel.push(n);
      lsSet('conclusionSdg', sel);
      chip.classList.toggle('selected');
    });
  });
  const txt = document.getElementById('conclusionText');
  txt.addEventListener('input', ()=> lsSet('conclusionText', txt.value));
}

/* ---- Analyzer (whole-class, 3 cases as tabs) ---- */
function getAnalyzerStates(){
  return lsGet('analyzerStates', {});
}
function setAnalyzerState(caseId, patch){
  const all = getAnalyzerStates();
  all[caseId] = Object.assign({problem:'',s:'',t:'',e:'',m:'',sdg:[],justification:''}, all[caseId]||{}, patch);
  lsSet('analyzerStates', all);
  return all[caseId];
}
let activeCaseId = null;

function attachAnalyzer(){
  const tabsWrap = document.getElementById('caseTabs');
  if(!tabsWrap) return;
  activeCaseId = activeCaseId || CASES[0].id;

  function drawTabs(){
    const allStates = getAnalyzerStates();
    tabsWrap.innerHTML = CASES.map(c=>{
      const st = allStates[c.id];
      const done = st && st.problem && st.s && st.t && st.e && st.m;
      return `<div class="case-tab ${c.id===activeCaseId?'active':''}" data-tab="${c.id}">
        <div class="who">${c.who}</div>
        <div class="mini-svg">${caseVisual(c)}</div>
        <div class="cname">${c.title}</div>
        ${done? '<div class="doneflag"><i class="fa-solid fa-check"></i> заповнено</div>' : ''}
      </div>`;
    }).join('');
    tabsWrap.querySelectorAll('[data-tab]').forEach(el=>{
      el.addEventListener('click', ()=>{ activeCaseId = el.dataset.tab; drawTabs(); drawDetail(); });
    });
  }

  function drawDetail(){
    const c = CASES.find(x=>x.id===activeCaseId);
    const blank = {problem:'',s:'',t:'',e:'',m:'',sdg:[],justification:''};
    const st = getAnalyzerStates()[c.id] || c.example || blank;
    const detail = document.getElementById('caseDetail');
    detail.innerHTML = `
      <div class="grid cols-2" style="margin-top:6px;align-items:start;">
        <div class="tech-illustration" style="height:150px;">${caseVisual(c)}</div>
        <div>
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px;">${c.title}</div>
          <div style="font-size:.85rem;color:var(--ink-dim);line-height:1.55;">${c.text}</div>
        </div>
      </div>
      <div style="margin-top:16px;">
        <label class="field-label">Яку проблему розв\u2019язує це рішення?</label>
        <textarea id="fProblem" rows="2">${st.problem}</textarea>
      </div>
      <div class="grid cols-2" style="margin-top:12px;">
        <div><label class="field-label">S (наука) — яке природниче явище задіяне?</label><textarea id="fS" rows="2">${st.s}</textarea></div>
        <div><label class="field-label">T (технології) — які матеріали/технологічні рішення?</label><textarea id="fT" rows="2">${st.t}</textarea></div>
        <div><label class="field-label">E (інженерія) — яка конструкція/механізм?</label><textarea id="fE" rows="2">${st.e}</textarea></div>
        <div><label class="field-label">M (математика) — де потрібні розрахунки/вимірювання?</label><textarea id="fM" rows="2">${st.m}</textarea></div>
      </div>
      <div style="margin-top:12px;">
        <label class="field-label">Якій Цілі Сталого Розвитку відповідає рішення?</label>
        <div class="sdg-grid" id="analyzerSdgGrid"></div>
        <textarea id="fJustification" rows="2" placeholder="Чому саме ця ціль? Обґрунтуйте." style="margin-top:8px;">${st.justification}</textarea>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <span id="saveStatus" style="font-size:.82rem;color:var(--ink-faint);align-self:center;"><i class="fa-solid fa-cloud-arrow-up"></i> Зберігається автоматично</span>
      </div>
      <div class="online-note" style="margin-top:12px;"><i class="fa-solid fa-file-pdf"></i><div><b>PDF-звіт</b>Усі відповіді зберігаються автоматично під час набору тексту. PDF із відповідями на обидва кейси ви сформуєте на наступному слайді («Рефлексія»).</div></div>`;

    const sdgGrid = document.getElementById('analyzerSdgGrid');
    sdgGrid.innerHTML = SDG.map(s=>`
      <button type="button" class="sdg-chip ${(st.sdg||[]).includes(s.n)?'selected':''}" data-asdg="${s.n}">
        <span class="sdg-num" style="background:${s.c}">${s.n}</span><span>${s.t}</span>
      </button>`).join('');
    sdgGrid.querySelectorAll('[data-asdg]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const n = parseInt(chip.dataset.asdg);
        const cur = getAnalyzerStates()[c.id] || {sdg:[]};
        let sdgArr = cur.sdg || [];
        if(sdgArr.includes(n)) sdgArr = sdgArr.filter(x=>x!==n); else sdgArr.push(n);
        setAnalyzerState(c.id, {sdg:sdgArr});
        chip.classList.toggle('selected');
        flashSaved();
        drawTabs();
        drawSummary();
      });
    });

    /* Live autosave: every keystroke updates storage immediately, so nothing
       is lost when switching tabs or exporting PDF — no separate save button. */
    let refreshTimer = null;
    [['fProblem','problem'],['fS','s'],['fT','t'],['fE','e'],['fM','m'],['fJustification','justification']].forEach(([elId,key])=>{
      const el = document.getElementById(elId);
      el.addEventListener('input', ()=>{
        setAnalyzerState(c.id, {[key]: el.value});
        flashSaved();
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(()=>{ drawTabs(); drawSummary(); }, 500);
      });
    });

  }

  function drawSummary(){
    const sum = document.getElementById('caseSummary');
    const states = getAnalyzerStates();
    sum.innerHTML = CASES.map(c=>{
      const st = states[c.id];
      const done = st && st.problem;
      return `<div class="summary-row">
        <div class="mini-svg">${caseVisual(c)}</div>
        <div style="flex:1;">
          <b>${c.title}</b> — ${done? (st.problem.slice(0,90)+(st.problem.length>90?'…':'')) : 'ще не розібрано'}
        </div>
        ${(st && st.sdg && st.sdg.length)? st.sdg.map(n=>`<span class="sdg-num" style="background:${sdgColor(n)}" title="${sdgTitle(n)}">${n}</span>`).join('') : ''}
      </div>`;
    }).join('');
  }

  drawTabs();
  drawDetail();
  drawSummary();
}

/* ---- PDF export: answers for the two student-led cases (solar + filter) ---- */
async function saveAnalyzerPdf(){
  const btn = document.getElementById('savePdfBtn');
  const nameEl = document.getElementById('pdfStudentName');
  const classEl = document.getElementById('pdfStudentClass');
  const name = nameEl ? nameEl.value.trim() : '';
  const klass = classEl ? classEl.value.trim() : '';
  let ok = true;
  if(nameEl && !requireField(nameEl)) ok = false;
  if(classEl && !requireField(classEl)) ok = false;
  if(!ok){ toast('Заповніть ім\u2019я та клас перед збереженням'); return; }
  lsSet('pdfName', name); lsSet('pdfClass', klass);

  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    toast('Бібліотеки для PDF не завантажились. Перевірте інтернет-з\u2019єднання.');
    return;
  }

  const origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Створюємо PDF…';

  // Flush whatever is currently on screen for the active tab, so an
  // unsaved keystroke (or a slow autosave) can never be lost on export.
  const liveEl = document.getElementById('fProblem');
  if(liveEl && activeCaseId && (activeCaseId==='solar' || activeCaseId==='filter')){
    setAnalyzerState(activeCaseId, {
      problem: liveEl.value,
      s: (document.getElementById('fS')||{}).value,
      t: (document.getElementById('fT')||{}).value,
      e: (document.getElementById('fE')||{}).value,
      m: (document.getElementById('fM')||{}).value,
      justification: (document.getElementById('fJustification')||{}).value
    });
  }

  const esc = (s)=> (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const states = getAnalyzerStates();
  const targets = CASES.filter(c=> c.id==='solar' || c.id==='filter');
  const dateStr = new Date().toLocaleDateString('uk-UA');

  const answerRow = (label, color, value)=> `
    <div style="margin-top:9px;font-size:12.5px;line-height:1.55;color:#3a3560 !important;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:${color} !important;margin-bottom:2px;">${label}</div>
      <div style="padding:8px 10px;background:#f7f6fc !important;border:1px solid #e1ddf5;border-radius:8px;color:#1c1830 !important;">${value || '<span style="color:#948dae !important;">— не заповнено —</span>'}</div>
    </div>`;

  const rows = targets.map(c=>{
    const blank = {problem:'',s:'',t:'',e:'',m:'',sdg:[],justification:''};
    const st = states[c.id] || blank;
    const sdgChips = (st.sdg||[]).length
      ? st.sdg.map(n=>`<span style="display:inline-block;margin:2px 6px 2px 0;padding:4px 10px;border-radius:999px;border:1.5px solid ${sdgColor(n)};color:#14162a !important;font-size:11px;font-weight:600;background:#ffffff !important;">${n}. ${esc(sdgTitle(n))}</span>`).join('')
      : '<span style="color:#948dae !important;font-size:12px;">— ціль не обрана —</span>';
    return `
      <div style="page-break-inside:avoid;margin-bottom:22px;padding:20px 22px;border:1px solid #e1ddf5;border-radius:16px;background:#ffffff !important;">
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div class="pdf-visual" style="flex:0 0 96px;width:96px;height:68px;border-radius:10px;background:#f7f6fc !important;display:flex;align-items:center;justify-content:center;overflow:hidden;">${caseVisual(c)}</div>
          <div style="flex:1;">
            <div style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:17px;color:#14162a !important;margin-bottom:6px;">${esc(c.title)}</div>
            <div style="font-size:11px;line-height:1.5;color:#5c5578 !important;">${esc(c.text)}</div>
          </div>
        </div>
        ${answerRow('Яку проблему розв\u2019язує рішення', '#14162a', esc(st.problem))}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">
          ${answerRow('S — наука', '#16a34a', esc(st.s))}
          ${answerRow('T — технології', '#2563eb', esc(st.t))}
          ${answerRow('E — інженерія', '#ca8a04', esc(st.e))}
          ${answerRow('M — математика', '#dc2626', esc(st.m))}
        </div>
        <div style="margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#14162a !important;margin-bottom:5px;">Ціль(і) сталого розвитку</div>
        <div>${sdgChips}</div>
        ${answerRow('Обґрунтування вибору цілі', '#14162a', esc(st.justification))}
      </div>`;
  }).join('');

  // Fixed light-theme values for every CSS variable used inside the case
  // icons/illustrations, so the PDF stays readable regardless of the
  // viewer's OS/browser dark-mode setting.
  const lightVars = "--bg:#f4f2fb;--surface:#ffffff;--surface-2:#f7f6fc;--surface-3:#edeafc;--border:#e1ddf5;"+
    "--ink:#1c1830;--ink-dim:#5c5578;--ink-faint:#948dae;--accent:#7c3aed;--accent-ink:#ffffff;--accent-soft:#efe8fd;"+
    "--s:#16a34a;--s-soft:#e6f7ec;--t:#2563eb;--t-soft:#e7effe;--e:#ca8a04;--e-soft:#fbf1dc;--m:#dc2626;--m-soft:#fbe6e5;";

  // Flush the reflection textarea too, in case it hasn't been typed into
  // yet on this visit (its own autosave already covers normal typing).
  const changeEl = document.getElementById('changeText');
  if(changeEl) lsSet('reflectionChange', changeEl.value);
  const proposal = (lsGet('reflectionChange','')||'').trim();
  const proposalSection = proposal ? `
    <div style="page-break-inside:avoid;margin-bottom:22px;padding:20px 22px;border:1px solid #e1ddf5;border-radius:16px;background:#ffffff !important;">
      <div style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:16px;color:#14162a !important;margin-bottom:8px;">Пропозиція учня: маленька зміна</div>
      <div style="padding:8px 10px;background:#f7f6fc !important;border:1px solid #e1ddf5;border-radius:8px;color:#1c1830 !important;font-size:12.5px;line-height:1.55;">${esc(proposal)}</div>
    </div>` : '';

  const template = document.createElement('div');
  template.id = 'pdfExportTemplate';
  template.style.cssText = lightVars+'position:fixed;left:-10000px;top:0;width:780px;background:#ffffff !important;padding:36px;font-family:Arial,Helvetica,sans-serif;';
  template.innerHTML = `
    <div style="font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:21px;color:#14162a !important;margin-bottom:4px;">STEM 7 · Урок 5 · STEM для сталого розвитку</div>
    <div style="font-size:12.5px;color:#5c5578 !important;margin-bottom:16px;">Домашнє завдання: аналіз STEM-рішень (портативні сонячні мікромережі та фільтри для води)</div>
    <div style="font-size:13px;color:#14162a !important;margin-bottom:22px;padding:10px 14px;background:#f7f6fc !important;border-radius:10px;">
      <b>Ім'я та прізвище:</b> ${esc(name)} &nbsp;&nbsp;&nbsp; <b>Клас:</b> ${esc(klass)} &nbsp;&nbsp;&nbsp; <b>Дата:</b> ${esc(dateStr)}
    </div>
    ${rows}
    ${proposalSection}
  `;
  document.body.appendChild(template);
  template.querySelectorAll('.pdf-visual svg, .pdf-visual img').forEach(v=>{
    v.style.width = '100%'; v.style.height = '100%';
    v.style.maxWidth = '100%'; v.style.maxHeight = '100%';
    if(v.tagName.toLowerCase()==='img') v.style.objectFit = 'cover';
  });

  let saved = false;
  try{
    const canvas = await html2canvas(template, {
      scale: 2,
      backgroundColor: '#ffffff',
      windowWidth: template.scrollWidth,
      onclone: (doc, el)=>{
        // Belt-and-braces: force every element's own text colour back to a
        // dark, readable ink in case the viewer's dark-mode styles leak in.
        el.querySelectorAll('*').forEach(node=>{
          const cs = doc.defaultView.getComputedStyle(node);
          if(cs && cs.color && /rgba?\(255,\s*255,\s*255/.test(cs.color)){
            node.style.setProperty('color', '#1c1830', 'important');
          }
        });
      }
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }

    const safe = (s)=> (s||'').replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g,'') || 'учень';
    const filename = `STEM7_Урок5_${safe(name)}_${safe(klass)}.pdf`;

    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const dl = await window.claude.use('downloads');
        if(dl && typeof dl.save === 'function'){
          await dl.save(pdf.output('blob'), filename);
          saved = true;
        }
      }
    }catch(e){ /* fall through to anchor download */ }

    if(!saved){
      const blob = pdf.output('blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      saved = true;
    }
  }catch(err){
    console.error('PDF export failed', err);
    saved = false;
  }finally{
    document.body.removeChild(template);
    btn.disabled = false;
    btn.innerHTML = origHtml;
  }

  toast(saved ? 'PDF збережено' : 'Не вдалося зберегти PDF. Спробуйте ще раз.');
}

/* ---- Reflection ---- */
function attachReflection(){
  const chg = document.getElementById('changeText');
  if(chg){
    chg.addEventListener('input', ()=>{ lsSet('reflectionChange', chg.value); flashSaved(); });
  }
  const nameEl = document.getElementById('pdfStudentName');
  const classEl = document.getElementById('pdfStudentClass');
  if(nameEl) nameEl.addEventListener('input', (e)=> lsSet('pdfName', e.target.value));
  if(classEl) classEl.addEventListener('input', (e)=> lsSet('pdfClass', e.target.value));
  const pdfBtn = document.getElementById('savePdfBtn');
  if(pdfBtn) pdfBtn.addEventListener('click', saveAnalyzerPdf);
}
